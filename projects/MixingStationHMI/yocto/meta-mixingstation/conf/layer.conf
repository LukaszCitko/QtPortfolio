# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mixingstation"
BBFILE_PATTERN_meta-mixingstation = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mixingstation = "6"

LAYERDEPENDS_meta-mixingstation = "core"
LAYERSERIES_COMPAT_meta-mixingstation = "wrynose"
